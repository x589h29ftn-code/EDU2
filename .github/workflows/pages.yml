name: Tinga Sneek op GitHub Pages

# Publiceert het spel als statische site. Er is geen build-stap: index.html,
# js/ en lib/ worden zo naar Pages gezet. Draait bij elke push naar de
# ontwikkelbranch en kan ook met de hand gestart worden.
on:
  push:
    branches:
      - claude/gta-game-tinga-sneek-st3yxi
      - claude/gta-tinga-game-setup-lcm1jy
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén publicatie tegelijk; een nieuwe push wacht netjes op de vorige.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Site samenstellen
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r js lib _site/
          # audio/ en beeld/ zijn de twee mappen die het spel tijdens het spelen
          # nog ophaalt: de radio en het menu lezen nummers.json en zenders.json,
          # het laadscherm leest beelden.json. Stonden ze er niet in, dan laadde
          # de webversie wel maar bleef de radio stil en het laadscherm zwart.
          # Samen ruim twintig megabyte; dat past ruim in een Pages-site.
          cp -r audio beeld _site/
          # Pages draait standaard Jekyll; dat is hier niet nodig en zou mappen
          # die met een underscore beginnen weglaten.
          touch _site/.nojekyll

      # Hier viel het om, vanaf de allereerste run: "Get Pages site failed ...
      # Not Found". De workflow deed niets verkeerd — Pages stond in de
      # repo-instellingen nooit aangezet, dus was er geen site om naartoe te
      # publiceren.
      #
      # `enablement: true` laat de actie hem zelf aanmaken, maar dat mag níet
      # met het token dat GitHub aan een workflow geeft: dan komt er
      # "Create Pages site failed. Resource not accessible by integration".
      # Aanzetten is eenmalig handwerk en kan alleen met beheerdersrechten:
      #
      #   Settings -> Pages -> Source: GitHub Actions
      #
      # De regel blijft staan omdat hij daarna niets meer doet (de site bestaat
      # dan) en hij hem wél aanzet als deze workflow ooit met een persoonlijk
      # token draait.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
