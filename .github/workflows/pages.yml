name: Tinga Sneek op GitHub Pages

# Publiceert het spel als statische site. Er is geen build-stap: index.html,
# js/ en lib/ worden zo naar Pages gezet. Draait bij elke push naar de
# ontwikkelbranch en kan ook met de hand gestart worden.
on:
  push:
    branches:
      - claude/gta-game-tinga-sneek-st3yxi
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén publicatie tegelijk; een nieuwe push wacht netjes op de vorige.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Site samenstellen
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r js lib _site/
          # Pages draait standaard Jekyll; dat is hier niet nodig en zou mappen
          # die met een underscore beginnen weglaten.
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
