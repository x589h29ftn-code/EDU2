# Bouwt de Windows-versie van Tinga. Na een run staat er onder "Artifacts" een
# zip met Tinga.exe die je kunt downloaden en uitpakken.
name: Windows-app

on:
  push:
    branches: [claude/gta-game-tinga-sneek-st3yxi, claude/gta-tinga-game-setup-lcm1jy, main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Afhankelijkheden
        run: npm ci
      - name: Inpakken
        shell: bash
        run: npm run dist:win
      - name: Inhoud tonen
        shell: bash
        run: ls -la dist/Tinga-win32-x64 | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: Tinga-windows
          path: dist/Tinga-win32-x64
          retention-days: 30
