# Bouwt de Windows-versie van Tinga. Na een run staat er onder "Artifacts" een
# zip met Tinga.exe die je kunt downloaden en uitpakken.
name: Windows-app

on:
  push:
    branches: [claude/gta-game-tinga-sneek-st3yxi, main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Afhankelijkheden
        run: npm ci
      - name: Inpakken
        run: npx electron-packager . Tinga --platform=win32 --arch=x64 --out dist --overwrite --no-asar --ignore="(^/dist)|(^/shots)|(^/\.git)"
      - name: Versie tonen
        run: dir dist\Tinga-win32-x64
      - uses: actions/upload-artifact@v4
        with:
          name: Tinga-windows
          path: dist/Tinga-win32-x64
          retention-days: 30
