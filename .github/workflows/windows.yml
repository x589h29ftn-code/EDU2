# Bouwt de Windows-versie van Tinga. Na een run staat er onder "Artifacts" een
# zip met Tinga.exe die je kunt downloaden en uitpakken.
#
# Let op de aanleiding: hij draaide bij élke push en bewaarde elke build dertig
# dagen. Eén build is ruim honderd megabyte, en bij zes pushes op een dag staan
# er binnen twee weken tientallen kopieën van hetzelfde spel. Op 16 september
# waren dat er vierennegentig, samen 18,8 GB, en toen liep het opslagquotum van
# Actions vol: de build slaagde nog steeds, maar het uploaden gaf
# "Artifact storage quota has been hit" — en dus kwam er geen .exe meer uit.
#
# Daarom draait hij nu alleen nog als je hem zelf start, en blijft het resultaat
# vijf dagen staan. Een .exe maak je op het moment dat je er een wilt:
#
#   Actions -> "Windows-app" -> Run workflow (kies desnoods een andere tak)
#
# De webversie op GitHub Pages werkt gewoon door bij elke push; die staat in
# .github/workflows/pages.yml. Opruimen van oude builds kan met
# .github/workflows/opruimen.yml.
name: Windows-app

on:
  workflow_dispatch:
  # Een tag die met v begint levert ook een build op, zodat een uitgave er altijd
  # een heeft: `git tag v0.9 && git push origin v0.9`.
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Afhankelijkheden
        run: npm ci
      - name: Inpakken
        shell: bash
        run: npm run dist:win
      - name: Inhoud tonen
        shell: bash
        run: ls -la dist/Tinga-win32-x64 | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: Tinga-windows
          path: dist/Tinga-win32-x64
          # Vijf dagen is genoeg om hem te downloaden en uit te proberen. Langer
          # bewaren betekent alleen dat er meer kopieën tegelijk in de opslag
          # staan; opnieuw bouwen kan altijd.
          retention-days: 5
