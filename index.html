<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tinga Sneek – open wereld</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body.touch { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: rgba(255,255,255,.9); }
  #crosshair::before { left: 6px; top: 0; width: 2px; height: 14px; }
  #crosshair::after { top: 6px; left: 0; width: 14px; height: 2px; }
  #street { position: absolute; left: 24px; bottom: 24px; font-size: 22px; font-weight: 700; letter-spacing: .5px; background: #0b3d91; border: 3px solid #fff; border-radius: 6px; padding: 6px 14px; text-shadow: none; }
  #speed { position: absolute; right: 24px; bottom: 170px; font-size: 26px; font-weight: 700; display: none; }
  #ammo { position: absolute; right: 24px; bottom: 170px; font-size: 22px; font-weight: 700; }
  #hint { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); font-size: 14px; opacity: .85; white-space: nowrap; }
  #msg { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); font-size: 26px; font-weight: 700; opacity: 0; transition: opacity .3s; }
  /* gesprekken: een tekstbalk onderin het scherm, door te klikken met E */
  #dialoog { position: absolute; left: 50%; bottom: 54px; transform: translateX(-50%);
             width: min(760px, 88vw); box-sizing: border-box; padding: 10px 16px;
             background: rgba(8,14,24,.80); border-left: 4px solid #ffd400; border-radius: 8px;
             text-shadow: none; pointer-events: auto; cursor: pointer;
             display: flex; gap: 12px; align-items: flex-start; }
  /* let op: een eigen display-regel verslaat de standaard van het hidden-attribuut */
  #dialoog[hidden] { display: none; }
  #dialoogKop { flex: 0 0 auto; width: 64px; height: 64px; border-radius: 6px; background: rgba(0,0,0,.35); }
  #dialoogNaam { color: #ffd400; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
  /* telefoongesprek: groene rand en een hoorntje voor de naam */
  #dialoog.telefoon { border-left-color: #4ade80; }
  #dialoog.telefoon #dialoogNaam { color: #4ade80; }
  #dialoog.telefoon #dialoogNaam::before { content: "☎ "; }
  #dialoogTekst { font-size: 18px; line-height: 1.4; margin-top: 3px; }
  #dialoogVerder { font-size: 12px; opacity: .6; margin-top: 7px; }
  #praat { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%);
           font-size: 15px; font-weight: 700; background: rgba(8,14,24,.62);
           padding: 6px 14px; border-radius: 6px; }
  #opdracht { position: absolute; left: 24px; top: 42px; font-size: 14px; font-weight: 700; color: #ffd400; }
  /* rood knipperend doel, bijvoorbeeld "schiet hem NIET neer" */
  #opdracht.rood { color: #ff5a44; animation: knipper 1s steps(1, end) infinite; }
  @keyframes knipper { 0%, 60% { opacity: 1; } 61%, 100% { opacity: .25; } }
  /* portemonnee */
  #geld { position: absolute; right: 24px; bottom: 205px; font-size: 20px; font-weight: 700; color: #ffd400; }
  /* gezocht-sterren, onder de minikaart */
  #ster { position: absolute; right: 26px; top: 232px; font-size: 26px; letter-spacing: 3px; color: #ffd400;
          text-shadow: 0 2px 6px rgba(0,0,0,.85); }
  #ster .leeg { color: rgba(255,255,255,.22); }
  #ster.knippert { animation: sterKnippert .9s steps(1,end) infinite; }
  @keyframes sterKnippert { 50% { opacity: .35; } }
  #geld .buit { display: block; font-size: 13px; color: #fff; opacity: .85; }
  /* mislukte missie: het beeld vaagt naar grijs */
  #game { transition: filter .8s; }
  body.mislukt #game { filter: grayscale(1) brightness(.55); }
  /* levensbalk, links onderin boven het straatnaambord */
  #leven { position: absolute; left: 24px; bottom: 74px; width: 200px; height: 15px;
           border: 2px solid rgba(255,255,255,.75); border-radius: 4px; background: rgba(8,14,24,.55);
           padding: 2px; box-sizing: border-box; }
  #levenbalk { height: 100%; width: 100%; border-radius: 2px; background: #4ade80; transition: width .15s, background .3s; }
  #levenlabel { position: absolute; left: 232px; bottom: 74px; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
  /* grote melding: missie voltooid, neergegaan */
  #missie { position: absolute; left: 50%; top: 38%; transform: translate(-50%,-50%); text-align: center;
            font-size: 44px; font-weight: 800; letter-spacing: 2px; color: #ffd400;
            text-shadow: 0 3px 14px rgba(0,0,0,.9); opacity: 0; transition: opacity .4s; }
  #missie .onder { display: block; margin-top: 8px; font-size: 17px; font-weight: 600; letter-spacing: 0; color: #fff; }
  /* rode flits als je geraakt wordt */
  #raakflits { position: absolute; inset: 0; opacity: 0; transition: opacity .25s;
               background: radial-gradient(ellipse at center, rgba(180,0,0,0) 35%, rgba(180,0,0,.75) 100%); }
  /* drie biertjes op: het beeld wordt wazig aan de randen en warm van kleur.
     De vervaging gaat over het beeld eronder (backdrop-filter); browsers die
     dat niet kunnen laten alleen de warme waas zien, en dat is genoeg. */
  #dronken { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .4s;
             backdrop-filter: blur(2.6px) saturate(1.25);
             background: radial-gradient(ellipse at center, rgba(255,180,80,0) 22%, rgba(120,70,20,.55) 100%); }
  #minimap { position: absolute; right: 20px; top: 20px; width: 220px; height: 220px; border-radius: 50%; box-shadow: 0 2px 12px rgba(0,0,0,.5); background: #3f6a2b; }
  #bigmap { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  #title { position: absolute; left: 24px; top: 20px; font-size: 13px; opacity: .8; }
  /* ---------- start-, laad- en pauzemenu (js/menu.js) ---------- */
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: flex-start;
             color: #fff; background: #070b12; z-index: 20; }
  /* de achtergrond van het menu: een donkere waas over het spelbeeld heen */
  #menudoek { position: absolute; inset: 0; background-size: cover; background-position: center; }
  /* de achtergrond wegvegen aan de kant waar de knoppen staan, zodat de tekst
     leesbaar blijft en het beeld rechts open blijft */
  #menudoek::after { content: ""; position: absolute; inset: 0;
                     background: linear-gradient(100deg, rgba(5,8,14,.96) 0%, rgba(5,8,14,.88) 38%, rgba(5,8,14,.30) 100%); }
  /* het paneel blijft binnen het scherm: met de besturing uitgeklapt is het
     langer dan een laptopscherm hoog, en dan viel de titel eraf */
  .menupaneel { position: relative; margin-left: min(9vw, 120px); width: min(430px, 86vw);
                max-height: 92vh; overflow-y: auto; padding: 3vh 4px 3vh 0;
                scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; }
  .menupaneel::-webkit-scrollbar { width: 6px; }
  .menupaneel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); border-radius: 3px; }
  .menupaneel h1 { margin: 0; font-size: clamp(46px, 7vw, 84px); font-weight: 800; letter-spacing: 6px; line-height: .95; }
  .menuonder { font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; opacity: .62; margin: 6px 0 26px; }
  .menulijst { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .menuknop { font-size: 19px; font-weight: 600; letter-spacing: .5px; padding: 9px 0; width: 100%;
              text-align: left; border: 0; background: none; color: rgba(255,255,255,.72); cursor: pointer;
              border-left: 3px solid transparent; padding-left: 14px; transition: color .12s, border-color .12s, padding-left .12s; }
  .menuknop:hover, .menuknop:focus-visible { color: #fff; border-left-color: #ffd400; padding-left: 20px; outline: none; }
  .menuknop.hoofd { color: #ffd400; font-weight: 800; }
  .menuknop.hoofd:hover { color: #ffe25a; }
  .menuknop[hidden] { display: none; }
  .menuzij { margin-top: 22px; padding: 16px 18px; background: rgba(255,255,255,.05);
             border: 1px solid rgba(255,255,255,.10); border-radius: 10px; font-size: 13px; }
  .menuzij[hidden] { display: none; }
  .menuzij h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #ffd400; }
  .menurij { display: flex; gap: 12px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.07); align-items: center; }
  .menurij:last-child { border-bottom: 0; }
  .menusleutel { flex: 0 0 130px; font-weight: 700; color: rgba(255,255,255,.82); }
  .menuwaarde { font-size: 13px; font-weight: 700; color: #ffd400; background: rgba(255,212,0,.10);
                border: 1px solid rgba(255,212,0,.35); border-radius: 5px; padding: 2px 10px; cursor: pointer; }
  .menuwaarde:hover { background: rgba(255,212,0,.2); }
  .menuvoet { margin-top: 26px; font-size: 11px; opacity: .45; letter-spacing: .3px; }

  /* het laadscherm: beeldvullende achtergrond met de balk eronder */
  #laadscherm { position: absolute; inset: 0; background: #05080e; }
  #laadscherm[hidden] { display: none; }
  #laaddoek { position: absolute; inset: 0; background-size: cover; background-position: center; }
  #laaddoek::after { content: ""; position: absolute; inset: 0;
                     background: linear-gradient(to bottom, rgba(5,8,14,.15) 40%, rgba(5,8,14,.92) 100%); }
  #laadvoet { position: absolute; left: min(7vw, 90px); right: min(7vw, 90px); bottom: min(9vh, 64px); }
  #laadtitel { font-size: clamp(30px, 4.6vw, 54px); font-weight: 800; letter-spacing: 6px; }
  #laadtip { font-size: 14px; opacity: .75; margin: 6px 0 18px; max-width: 620px; line-height: 1.45; }
  #laadbalk { height: 6px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; }
  #laadbalkin { height: 100%; width: 0; background: #ffd400; border-radius: 3px; transition: width .18s linear; }
  #laadwat { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; opacity: .6; margin-top: 8px; }

  @media (max-width: 900px), (max-height: 560px) {
    .menupaneel { margin-left: 6vw; width: min(320px, 88vw); }
    .menuknop { font-size: 16px; padding: 7px 0 7px 12px; }
    .menusleutel { flex: 0 0 96px; }
    #laadtip { font-size: 12px; }
  }

  /* ---------- touchbesturing ---------- */
  #touch { position: fixed; inset: 0; display: none; z-index: 5; touch-action: none; }
  #tmove, #tlook { position: absolute; top: 0; bottom: 0; touch-action: none; }
  #tmove { left: 0; width: 45%; }
  #tlook { right: 0; width: 55%; }
  #tstick { position: absolute; width: 132px; height: 132px; margin: 0; border-radius: 50%;
            border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.10);
            transform: translate(-50%,-50%); opacity: 0; transition: opacity .12s; pointer-events: none; }
  #tstick.on { opacity: 1; }
  #tknob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; border-radius: 50%;
           background: rgba(255,255,255,.55); border: 2px solid rgba(255,255,255,.85);
           transform: translate(-50%,-50%); }
  .tbtn { position: absolute; display: flex; align-items: center; justify-content: center;
          border-radius: 50%; background: rgba(12,20,34,.45); border: 2px solid rgba(255,255,255,.55);
          color: #fff; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.8);
          touch-action: none; -webkit-user-select: none; user-select: none; }
  .tbtn.down { background: rgba(255,212,0,.55); border-color: #ffd400; color: #1a1a1a; text-shadow: none; }
  #tfire { right: 22px; bottom: 22px; width: 92px; height: 92px; font-size: 13px; letter-spacing: .5px;
           background: rgba(150,26,26,.45); border-color: rgba(255,150,150,.7); }
  #tjump { right: 128px; bottom: 40px; width: 66px; height: 66px; font-size: 12px; }
  #treload { right: 34px; bottom: 128px; width: 58px; height: 58px; font-size: 18px; }
  #tcar { right: 136px; bottom: 122px; width: 58px; height: 58px; font-size: 18px; }
  #tmap { right: 22px; top: 168px; width: 52px; height: 52px; font-size: 18px; }
  #tcam { right: 22px; top: 228px; width: 52px; height: 52px; font-size: 18px; }
  #tpause { left: 16px; top: 46px; width: 46px; height: 46px; font-size: 16px; }
  /* munitie en snelheid naast de pauzeknop: rechtsonder zitten de knoppen */
  body.touch #ammo, body.touch #speed { left: 74px; top: 54px; right: auto; bottom: auto; font-size: 17px; }

  /* op een telefoon is de ronde minikaart en de tekst een stuk te groot */
  @media (max-width: 900px), (max-height: 560px) {
    #minimap { width: 128px; height: 128px; right: 14px; top: 14px; }
    #tmap { top: 152px; }
    #tcam { top: 210px; }
    #street { left: 14px; bottom: 14px; font-size: 15px; padding: 4px 10px; border-width: 2px; }
    #ammo, #speed { right: 20px; bottom: 196px; font-size: 17px; }
    #hint { display: none; }
    #title { font-size: 11px; left: 70px; top: 18px; }
    #msg { font-size: 19px; top: 12%; }
    #bigmap { width: auto; height: auto; max-width: 94vw; max-height: 86vh; }
    /* rechtsonder zitten op een telefoon de knoppen, dus schuift de tekstbalk
       naar links en wordt hij smaller */
    #dialoog { left: 10px; bottom: 58px; transform: none; width: 60vw; padding: 8px 12px; border-left-width: 3px; }
    #dialoogTekst { font-size: 14px; }
    #dialoogVerder { font-size: 11px; margin-top: 4px; }
    #praat { left: 10px; bottom: 62px; transform: none; font-size: 13px; }
    #opdracht { left: 70px; top: 34px; font-size: 12px; }
    #leven { left: 14px; bottom: 44px; width: 128px; height: 12px; }
    #geld { right: 20px; bottom: 232px; font-size: 15px; }
    #ster { right: 18px; top: 168px; font-size: 19px; letter-spacing: 2px; }
    #geld .buit { font-size: 11px; }
    #dialoogKop { width: 44px; height: 44px; }
    #levenlabel { left: 148px; bottom: 44px; font-size: 10px; }
    #missie { font-size: 26px; }
    #missie .onder { font-size: 13px; }
    .panel { max-width: 94vw; max-height: 88vh; overflow: auto; padding: 18px 20px; }
    .panel h1 { font-size: 22px; }
    .panel h2 { font-size: 12px; margin-bottom: 12px; }
    .panel table { font-size: 12px; margin-bottom: 14px; }
    .panel td:first-child { width: 108px; }
    .streets { display: none; }
  }

</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="title">TINGA · SNEEK</div>
  <div id="crosshair"></div>
  <canvas id="minimap" width="220" height="220"></canvas>
  <div id="street">Molenkrite</div>
  <div id="speed"></div>
  <div id="ammo"></div>
  <div id="hint"></div>
  <div id="msg"></div>
  <div id="raakflits"></div>
  <div id="dronken"></div>
  <div id="opdracht" hidden></div>
  <div id="leven"><div id="levenbalk"></div></div>
  <div id="levenlabel">100</div>
  <div id="geld" hidden></div>
  <div id="ster" hidden></div>
  <div id="missie"></div>
  <div id="praat" hidden>E — praten</div>
  <div id="dialoog" hidden>
    <canvas id="dialoogKop" width="72" height="72" hidden></canvas>
    <div>
      <div id="dialoogNaam"></div>
      <div id="dialoogTekst"></div>
      <div id="dialoogVerder"></div>
    </div>
  </div>
  <canvas id="bigmap" width="1100" height="760"></canvas>
</div>
<div id="touch">
  <div id="tmove"><div id="tstick"><div id="tknob"></div></div></div>
  <div id="tlook"></div>
  <div class="tbtn" id="tfire">VUUR</div>
  <div class="tbtn" id="tjump">SPRING</div>
  <div class="tbtn" id="treload">⟳</div>
  <div class="tbtn" id="tcar">🚗</div>
  <div class="tbtn" id="tmap">🗺</div>
  <div class="tbtn" id="tcam">👁</div>
  <div class="tbtn" id="tpause">❚❚</div>
</div>
<!-- het start-, laad- en pauzemenu wordt gevuld door js/menu.js -->
<div id="overlay"></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
